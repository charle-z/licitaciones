name: suplos-pruebas
services:
  mysql-test:
    image: mysql:8.4.13@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: suplos_test
      MYSQL_USER: test
      MYSQL_PASSWORD: local-test-only
      MYSQL_ROOT_PASSWORD: local-test-root-only
    volumes:
      - ./bd:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT COUNT(*) FROM actividades' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks: [tests]
  tests:
    build:
      context: .
      target: development
    environment:
      DB_HOST: mysql-test
      DB_DATABASE: suplos_test
      DB_USERNAME: test
      DB_PASSWORD: local-test-only
    depends_on:
      mysql-test:
        condition: service_healthy
    networks: [tests]
networks:
  tests:
    internal: true
